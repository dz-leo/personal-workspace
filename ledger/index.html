  +'<div style="font-size:12px;color:var(--text-2)">当前存储</div>'
  +'<div style="font-size:15px;font-weight:600;margin-top:2px">'+esc(Storage.statusText())+'</div>'
  +'<div class="hint">数据保存在这台设备的浏览器里，不上传任何服务器。换设备或清理浏览器前请先导出备份。</div></div>'
  +'<div class="card pad">'
  +'<button class="mi" id="dExportJson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>'
  +'<span>导出 JSON 备份<span class="mi-s">完整快照，可导入恢复（当前 '+cnt+' 条）</span></span></button>'
  +'<button class="mi" id="dExportCsv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M10 9v12M4 15h16"/></svg>'
  +'<span>导出 CSV<span class="mi-s">流水表格，可用 Excel 打开</span></span></button>'
  +'<button class="mi" id="dImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 19h16"/></svg>'
  +'<span>导入恢复<span class="mi-s">支持上千条，导入前自动备份当前数据</span></span></button>'
  +'</div>'
  +(DB.meta.isDemo?'<div class="card pad" style="margin-top:14px"><button class="mi" id="dClearDemo">'
  +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>'
  +'<span>清空示例数据<span class="mi-s">只删示例，保留你自己记的账</span></span></button></div>':'')
  +'<div class="card pad" style="margin-top:14px"><button class="mi dg" id="dClearAll">'
  +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/></svg>'
  +'<span>清空全部数据<span class="mi-s">不可恢复，请务必先导出备份</span></span></button></div>'
  +'<div class="hint" style="margin-top:16px">后期接入云端同步后，这里会显示同步状态与手动同步按钮。存储层已按适配器模式写好，接后端不用动业务代码。</div>'
  +'</div>';
  $('sheetData').innerHTML=html;
  $('maskData').classList.add('on');
  document.body.style.overflow='hidden';
  $('dClose').addEventListener('click',closeData);
  $('dExportJson').addEventListener('click',exportJSON);
  $('dExportCsv').addEventListener('click',exportCSV);
  $('dImport').addEventListener('click',pickImport);
  var cd=$('dClearDemo'); if(cd) cd.addEventListener('click',clearDemo);
  $('dClearAll').addEventListener('click',clearAll);
}
function closeData(){ $('maskData').classList.remove('on'); document.body.style.overflow=''; }
function download(filename,content,mime){
  var blob=new Blob([content],{type:mime||'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
}
function exportJSON(){
  var payload={app:'wb-ledger',version:1,exportedAt:new Date().toISOString(),data:DB};
  download('账本备份_'+todayStr()+'.json',JSON.stringify(payload,null,2),'application/json');
  toast('已导出 JSON 备份');
}
function exportCSV(){
  var head=['日期','时间','类型','金额','一级分类','二级分类','账户','商家','标签','场景','固定支出','备注'];
  var rows=[head.join(',')];
  var list=getRecords().slice().sort(function(a,b){ return (a.date+' '+a.time).localeCompare(b.date+' '+b.time); });
  for(var i=0;i<list.length;i++){
    var r=list[i];
    rows.push([r.date,r.time,r.type==='expense'?'支出':(r.type==='transfer'?'不计入':'收入'),Number(r.amount).toFixed(2),
      catById(r.category).name,r.subCategory||'',r.account||'',r.merchant||'',
      (r.tags||[]).join('|'),r.scene||'',r.isFixed?'是':'否',r.note||'']
      .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
  }
  download('账本流水_'+todayStr()+'.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');
  toast('已导出 CSV');
}
function pickImport(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.addEventListener('change',function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var obj=JSON.parse(fr.result);
        var data=(obj&&obj.data)?obj.data:obj;
        if(!data||!Array.isArray(data.records)) throw new Error('格式不匹配');
        var n=data.records.length;
        confirmBox({ title:'导入 '+n+' 条记录？', desc:'将用备份文件覆盖当前数据。当前数据会自动存一份临时备份。', okText:'导入',
          onOk:function(){
            try{ localStorage.setItem(CONFIG.storage.localKey+'_bak_'+Date.now(),JSON.stringify(DB)); }catch(e){}
            DB=data; loadDBNormalize(); saveDB(); closeData();
            state.date=todayStr(); state.view='day'; refreshAll(); toast('已导入 '+n+' 条记录');
          }});
      }catch(e){ toast('文件格式不正确'); }
    };
    fr.readAsText(f);
  });
  inp.click();
}
function loadDBNormalize(){
  if(!DB.meta) DB.meta={version:1};
  if(!Array.isArray(DB.records)) DB.records=[];
  if(!Array.isArray(DB.notes)) DB.notes=[];
  if(!DB.settings) DB.settings=defaultDB().settings;
  if(!DB.settings.categories) DB.settings.categories=JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  if(!DB.settings.accounts) DB.settings.accounts=JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
  if(!DB.settings.tags) DB.settings.tags=DEFAULT_TAGS.slice();
  if(!DB.settings.scenes) DB.settings.scenes=DEFAULT_SCENES.slice();
  if(!DB.settings.budget) DB.settings.budget={enabled:false,amount:0};
  if(!Array.isArray(DB.settings.ignoredMissDays)) DB.settings.ignoredMissDays=[];
}
function clearDemo(){
  confirmBox({ title:'清空示例数据？', desc:'只会删除首次打开时预置的示例账单，你自己记的账会保留。', okText:'清空示例',
    onOk:function(){
      var before=DB.records.length;
      DB.records=DB.records.filter(function(r){ return !r.demo; });
      var removed=before-DB.records.length;
      DB.notes=DB.notes.filter(function(n){ return !n.demo; });
      DB.meta.isDemo=false;
      saveDB(); closeData(); state.date=todayStr(); refreshAll();
      toast('已清空 '+removed+' 条示例数据');
    }});
}
function clearAll(){
  confirmBox({ title:'清空全部数据', desc:'这会删除所有账单和小记，且无法恢复。请输入「清空」二字确认。', needType:'清空', okText:'确认清空', danger:true,
    onOk:function(){
      DB=defaultDB(); DB.meta.seeded=true; saveDB(); closeData();
      state.date=todayStr(); state.view='day'; refreshAll(); toast('已清空全部数据');
    }});
}
function confirmBox(opt){
  var html='<div class="cf-b"><div class="cf-t">'+esc(opt.title)+'</div><div class="cf-d">'+esc(opt.desc||'')+'</div>'
    +(opt.needType?'<div class="cf-i"><input class="inp" id="cfIn" type="text" placeholder="请输入：'+esc(opt.needType)+'"></div>':'')
    +'</div><div class="cf-f"><button id="cfNo">取消</button><button id="cfYes" class="ok'+(opt.danger?' dg':'')+'">'+esc(opt.okText||'确定')+'</button></div>';
  $('confirmBox').innerHTML=html;
  $('maskConfirm').classList.add('on');
  function close(){ $('maskConfirm').classList.remove('on'); }
  $('cfNo').addEventListener('click',close);
  $('cfYes').addEventListener('click',function(){
    if(opt.needType){
      var v=(($('cfIn')&&$('cfIn').value)||'').trim();
      if(v!==opt.needType){ toast('请输入「'+opt.needType+'」确认'); return; }
    }
    close();
    if(opt.onOk) opt.onOk();
  });
  $('maskConfirm').onclick=function(e){ if(e.target===$('maskConfirm')) close(); };
}

var CAT_PALETTE=['#C25B54','#4A7BA7','#B0729B','#C98A2E','#6B8E6B','#9B6BB5','#4E8C8C','#7B8FA1','#C2705B','#5B9B9B','#7A8CA0','#C25B7E','#8A6F5C','#8A94A0','#3F8A6B'];
var catEditor={name:'',icon:'food',color:'#C25B54'};
function typeLabel(t){ return t==='expense'?'支出':(t==='income'?'入账':'不计入收支'); }
function openCatEditor(){
  catEditor={name:'',icon:'food',color:'#C25B54'};
  renderCatEditor();
  $('maskCat').classList.add('on');
}
function closeCatEditor(){ var m=$('maskCat'); if(m) m.classList.remove('on'); }
function renderCatEditor(){
  var iconOpts=Object.keys(ICON).map(function(k){
    return '<button class="cat-ic'+(k===catEditor.icon?' on':'')+'" data-ic="'+k+'">'+svgIcon(k,22)+'</button>';
  }).join('');
  var colorOpts=CAT_PALETTE.map(function(c){
    return '<button class="cat-clr'+(c===catEditor.color?' on':'')+'" data-clr="'+c+'" style="background:'+c+'"></button>';
  }).join('');
  var html='<div class="sh-head"><button class="btn ghost sm" id="catCancel">取消</button>'
    +'<h3>新增分类</h3><span style="width:44px"></span></div>'
    +'<div class="sh-body">'
    +'<div class="fld"><span class="lb">名称</span><input class="inp" id="catName" type="text" maxlength="6" placeholder="最多 6 个字" value="'+esc(catEditor.name)+'"></div>'
    +'<div class="fld"><span class="lb">图标</span><div class="cat-ics">'+iconOpts+'</div></div>'
    +'<div class="fld"><span class="lb">颜色</span><div class="cat-clrs">'+colorOpts+'</div></div>'
    +'<div class="hint">新分类会出现在「'+typeLabel(form.type)+'」通道下，可随时在表单里删除。</div>'
    +'</div><div class="sh-foot"><button class="btn primary" id="catSave">创建</button></div>';
  $('sheetCat').innerHTML=html;
  var nmEl=$('catName'); if(nmEl) nmEl.addEventListener('input',function(){ catEditor.name=nmEl.value; });
  $('catCancel').addEventListener('click',closeCatEditor);
  $('catSave').addEventListener('click',function(){
    var nm=(($('catName')&&$('catName').value)||'').trim();
    if(!nm){ toast('请输入分类名称'); if($('catName'))$('catName').focus(); return; }
    var id='c_'+Date.now().toString(36);
    DB.settings.categories.push({id:id,type:form.type,name:nm,color:catEditor.color,icon:catEditor.icon,subs:[],custom:true});
    saveDB();
    form.category=id; form.subCategory='';
    closeCatEditor();
    renderEditSheet(); toast('已新增「'+nm+'」');
  });
  var ics=$('sheetCat').querySelectorAll('[data-ic]');
  for(var i=0;i<ics.length;i++){ (function(b){ b.addEventListener('click',function(){ catEditor.icon=b.getAttribute('data-ic'); renderCatEditor(); }); })(ics[i]); }
  var cls=$('sheetCat').querySelectorAll('[data-clr]');
  for(var j=0;j<cls.length;j++){ (function(b){ b.addEventListener('click',function(){ catEditor.color=b.getAttribute('data-clr'); renderCatEditor(); }); })(cls[j]); }
}

/* ============================================================
   8. 初始化
   ============================================================ */
function bindGlobal(){
  $('btnAdd').addEventListener('click',function(){ openEdit(null); });
  $('btnData').addEventListener('click',openData);
  $('maskEdit').onclick=function(e){ if(e.target===$('maskEdit')) closeEdit(); };
  $('maskData').onclick=function(e){ if(e.target===$('maskData')) closeData(); };
  $('maskCat').onclick=function(e){ if(e.target===$('maskCat')) closeCatEditor(); };
  $('maskAcc').onclick=function(e){ if(e.target===$('maskAcc')) closeAccEditor(); };
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if($('maskConfirm').classList.contains('on')){ $('maskConfirm').classList.remove('on'); return; }
      if($('maskCat').classList.contains('on')){ closeCatEditor(); return; }
      if($('maskAcc').classList.contains('on')){ closeAccEditor(); return; }
      if($('maskEdit').classList.contains('on')){ closeEdit(); return; }
      if($('maskData').classList.contains('on')) closeData();
    }
  });
  var tabs=$('viewTabs').querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    (function(btn){
      btn.addEventListener('click',function(){
        state.view=btn.getAttribute('data-view');
        refreshAll();
      });
    })(tabs[i]);
  }
  // 移动端底部导航：日 / 周 / 资产 / 月 + 中间凸起「记一笔」
  var mnav=$('mnav');
  if(mnav){
    var mb=mnav.querySelectorAll('button[data-view]');
    for(var m=0;m<mb.length;m++){
      (function(btn){
        btn.addEventListener('click',function(){
          state.view=btn.getAttribute('data-view');
          refreshAll();
        });
      })(mb[m]);
    }
  }
  var madd=$('mnavAdd');
  if(madd) madd.addEventListener('click',function(){ openEdit(null); });
}
var _inited=false;
function init(){
  if(_inited) return;
  _inited=true;
  loadDB();
  if(!DB.meta.seeded && getRecords().length===0) seedDemo();
  bindGlobal();
  state.date=todayStr();
  state.view='day';
  refreshAll();
  var cnt=getRecords().length;
  if(cnt>0&&cnt%30===0) setTimeout(function(){ toast('数据已积累 '+cnt+' 条，建议导出备份'); },900);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
</script>
