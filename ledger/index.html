<title>我的账本</title>
<!--
  个人工作台 · 第一期：个人账本（S1-S4 完成）
  架构说明：
    - 单文件 HTML，全部 CSS/JS 内联，零外部依赖（断网可用）
    - 数据层为可插拔适配器（StorageAdapter），默认本地存储；
      接入云端只需实现 CloudAdapter 的方法并把 CONFIG.storage.mode 改为 'cloud'
    - 业务代码与存储完全解耦，可独立部署到任意静态托管或打包商用
    - 渲染层统一由 refreshAll() 调度，渲染函数之间禁止互调（防止调用链成环）
-->
<style>
:root{
  --brand:#3B6E97;
  --brand-soft:#E8F0F6;
  --expense:#C25B54;
  --income:#3F8A6B;
  --warn:#C98A2E;
  --bg:#F6F7F9;
  --card:#FFFFFF;
  --text:#1F2933;
  --text-2:#6B7684;
  --text-3:#9AA4AF;
  --line:#E4E7EB;
  --radius:14px;
  --shadow:0 1px 3px rgba(31,41,51,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;letter-spacing:.5px}
.brand svg{width:20px;height:20px;color:var(--brand)}
.boards{display:flex;align-items:center;gap:6px;margin-left:8px}
.board-chip{padding:5px 12px;border-radius:999px;font-size:13px;background:var(--brand-soft);color:var(--brand);font-weight:500}
.board-add{width:28px;height:28px;border-radius:999px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-3);cursor:not-allowed;background:none}
.spacer{flex:1}
.stg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.stg i{width:6px;height:6px;border-radius:50%;background:var(--income);display:block}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:0 14px;height:36px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;font-family:inherit;transition:background .15s,border-color .15s}
.btn:hover{background:var(--bg);border-color:var(--text-3)}
.btn:active{background:var(--line)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#33607F}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}

.sec{margin-top:16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:16px}
.sec-t{font-size:13px;color:var(--text-2);font-weight:500;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.sec-t svg{width:14px;height:14px}

.todo{border-left:3px solid var(--warn);background:#FDF8EF}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed rgba(201,138,46,.25)}
.todo-item:first-child{border-top:none}
.todo-txt{flex:1;font-size:13px}
.todo-item.warn .todo-txt{color:#8A5E1B}
.todo-item.info .todo-txt{color:var(--text)}
.todo-item.good .todo-txt{color:var(--income)}
.todo-dot{width:7px;height:7px;border-radius:50%;flex:none}
.warn .todo-dot{background:var(--warn)}
.info .todo-dot{background:var(--brand)}
.good .todo-dot{background:var(--income)}
.empty-tip{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px}

.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tab{flex:1;height:34px;border:none;background:none;border-radius:9px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit;font-weight:500}
.tab.on{background:var(--brand);color:#fff}

.dnav{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dnav .d{font-size:16px;font-weight:600;flex:1;text-align:center}
.dnav .d small{display:block;font-size:12px;color:var(--text-2);font-weight:400}
.navb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);flex:none}
.navb:hover{background:var(--bg)}
.navb svg{width:16px;height:16px}
.navt{border:none;background:none;color:var(--brand);font-size:12px;font-weight:500;cursor:pointer;padding:2px 8px;border-radius:6px;font-family:inherit}
.navt:hover{background:var(--bg)}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.sum-c{background:var(--card);padding:14px 12px;text-align:center}
.sum-l{font-size:12px;color:var(--text-2);margin-bottom:4px}
.sum-v{font-size:19px;font-weight:600;letter-spacing:-.2px}
.sum-v.e{color:var(--expense)}
.sum-v.i{color:var(--income)}
.sum-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.sum-extra{padding:10px 16px 0;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.up{color:var(--expense)}
.down{color:var(--income)}

.chart-wrap{padding:4px 12px 12px}
.chart-wrap svg{width:100%;height:auto;display:block}

.day-head{display:flex;align-items:baseline;gap:8px;padding:12px 16px 6px;font-size:12px;color:var(--text-2)}
.day-head b{font-size:13px;color:var(--text);font-weight:600}
.fold-head{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#FAFBFC;border-top:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--text-2)}
.fold-head b{font-size:13px;color:var(--text);font-weight:600}
.fold-head .caret{margin-left:auto;color:var(--text-3);display:flex;transition:transform .15s}
.fold-head.folded .caret{transform:rotate(-90deg)}
.rec{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.rec:hover{background:#FAFBFC}
.rec.flash{background:#FFF6E8}
.rec-ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.rec-ic svg{width:18px;height:18px}
.rec-main{flex:1;min-width:0}
.rec-t{font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec-t .cat{font-weight:500}
.rec-t .sub{font-size:11px;color:var(--text-2);background:var(--bg);padding:1px 6px;border-radius:5px}
.rec-m{font-size:12px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-amt{font-size:15px;font-weight:600;flex:none;letter-spacing:-.2px}
.rec-amt.e{color:var(--expense)}
.rec-amt.i{color:var(--income)}
.rec-amt.t{color:var(--brand)}
.tag-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px}
.empty{padding:36px 16px;text-align:center;color:var(--text-3);font-size:13px}
.empty svg{width:32px;height:32px;color:var(--line);margin-bottom:8px}

.cal{padding:4px 12px 14px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-head span{text-align:center;font-size:11px;color:var(--text-3);padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{
  min-height:50px;border-radius:9px;padding:5px 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  border:1.5px solid transparent;position:relative;transition:transform .1s;
}
.cal-cell:active{transform:scale(.95)}
.cal-cell .dnum{font-size:13px;font-weight:500;line-height:1.3}
.cal-cell .damt{font-size:10px;line-height:1.3;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-cell.l0{background:#FAFBFC;color:var(--text-3)}
.cal-cell.l1{background:#FAEDEB;color:#7A4A45}
.cal-cell.l2{background:#F0D5D1;color:#7A4A45}
.cal-cell.l3{background:#DFA9A3;color:#fff}
.cal-cell.l4{background:#C25B54;color:#fff}
.cal-cell.l3 .damt,.cal-cell.l4 .damt{color:rgba(255,255,255,.92)}
.cal-cell.l0 .damt,.cal-cell.l1 .damt,.cal-cell.l2 .damt{color:inherit;opacity:.72}
.cal-cell.today{border-color:var(--brand)}
.cal-cell.sel{box-shadow:0 0 0 2px var(--brand) inset}
.cal-cell.out{opacity:.32}
.cal-legend{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:var(--text-3);justify-content:center;flex-wrap:wrap}
.cal-legend i{width:12px;height:12px;border-radius:3px;display:block}

.dist-row{display:flex;align-items:center;gap:10px;margin-top:9px}
.dist-row:first-child{margin-top:0}
.dist-n{font-size:12px;width:52px;flex:none;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist-bar{flex:1;height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
.dist-fill{height:100%;border-radius:99px}
.dist-v{font-size:12px;width:88px;text-align:right;flex:none;color:var(--text-2)}
.ov{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.ov-c{background:var(--card);padding:12px 8px;text-align:center}
.ov-l{font-size:11px;color:var(--text-2)}
.ov-v{font-size:15px;font-weight:600;margin-top:2px}
.ov-v.e{color:var(--expense)}
.ov-v.i{color:var(--income)}
.sub-t{font-size:12px;color:var(--text-2);margin:16px 0 8px;font-weight:500;display:flex;align-items:center;gap:6px}
.sub-t:first-child{margin-top:0}
.donut-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.donut-legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.donut-legend i{width:8px;height:8px;border-radius:2px;display:block}

.note-box{border:1px dashed var(--line);border-radius:12px;padding:12px;background:#FCFDFE}
.note-auto{font-size:12px;color:var(--text-2);background:var(--bg);padding:8px 10px;border-radius:8px;margin-bottom:10px;line-height:1.5}
.note-auto b{color:var(--text);font-weight:500}
textarea.note{width:100%;border:none;background:none;resize:none;font-family:inherit;font-size:14px;color:var(--text);outline:none;min-height:44px;line-height:1.6}
textarea.note::placeholder{color:var(--text-3)}

.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));height:50px;padding:0 22px;border-radius:25px;border:none;background:var(--brand);color:#fff;font-size:15px;font-weight:500;display:flex;align-items:center;gap:7px;cursor:pointer;box-shadow:0 4px 14px rgba(59,110,151,.32);z-index:50;font-family:inherit}
.fab svg{width:18px;height:18px}
.fab:hover{background:#33607F}

.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(31,41,51,.42);z-index:100;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mask.on{display:block}
.sheet{background:var(--bg);width:100%;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.sh-head h3{margin:0;font-size:15px;font-weight:600;flex:1}
.sh-body{padding:16px;overflow-y:auto;flex:1;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sh-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;position:sticky;bottom:0}
.sh-foot .btn{flex:1;height:44px;font-size:14px}

.fld{margin-bottom:16px}
.lb{font-size:12px;color:var(--text-2);margin-bottom:7px;display:block;font-weight:500}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border:none;background:none;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit;font-weight:500}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on[data-type="expense"]{color:var(--expense)}
.seg button.on[data-type="income"]{color:var(--income)}
.amt-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:30px;font-weight:600;outline:none;font-family:inherit;color:var(--text);background:var(--card);letter-spacing:-.5px}
.amt-in:focus{border-color:var(--brand)}
.amt-in.e{color:var(--expense)}
.amt-in.i{color:var(--income)}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat-b{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:var(--text-2);font-family:inherit;transition:border-color .12s,background .12s}
.cat-b svg{width:20px;height:20px}
.cat-b.on{color:var(--text);font-weight:500}
.cat-b.custom .cat-del{display:block}
.cat-del{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--expense);color:#fff;font-size:13px;line-height:16px;text-align:center;border:2px solid var(--bg);cursor:pointer;display:none;padding:0}
.cat-add{color:var(--brand);border-style:dashed;justify-content:center}
.cat-ics{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cat-ic{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2)}
.cat-ic.on{color:var(--brand);border-color:var(--brand)}
.cat-clrs{display:flex;flex-wrap:wrap;gap:10px}
.cat-clr{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0}
.cat-clr.on{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 13px;min-height:32px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input.inp,select.inp{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;outline:none;font-family:inherit;background:var(--card);color:var(--text)}
input.inp:focus,select.inp:focus{border-color:var(--brand)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand)}
.hint{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.5}

.mi{display:flex;align-items:center;gap:12px;padding:14px 4px;width:100%;border:none;border-top:1px solid var(--line);background:none;cursor:pointer;font-family:inherit;font-size:14px;color:var(--text);text-align:left}
.mi:first-child{border-top:none}
.mi svg{width:17px;height:17px;color:var(--text-2);flex:none}
.mi .mi-s{font-size:12px;color:var(--text-3);display:block;font-weight:400}
.mi.dg{color:var(--expense)}
.mi.dg svg{color:var(--expense)}

.cf{max-width:360px;margin:22vh auto 0;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(31,41,51,.18)}
.cf-b{padding:22px 20px 16px}
.cf-t{font-size:16px;font-weight:600;margin-bottom:8px}
.cf-d{font-size:13px;color:var(--text-2);line-height:1.6}
.cf-i{margin-top:14px}
.cf-f{display:flex;border-top:1px solid var(--line)}
.cf-f button{flex:1;height:48px;border:none;background:none;font-size:15px;cursor:pointer;font-family:inherit;color:var(--text-2)}
.cf-f button+button{border-left:1px solid var(--line)}
.cf-f button.ok{color:var(--brand);font-weight:600}
.cf-f button.ok.dg{color:var(--expense)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:rgba(31,41,51,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:82vw;text-align:center}
.toast.on{opacity:1}

/* ---------- 资金账户 ---------- */
.acc{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s;background:none;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left;font-family:inherit}
.acc:hover{background:#FAFBFC}
.acc:first-child{border-top:none}
.acc-ic{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.acc-ic svg{width:19px;height:19px}
.acc-main{flex:1;min-width:0}
.acc-n{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--text)}
.acc-tag{font-size:11px;color:var(--text-2);background:var(--bg);padding:1px 6px;border-radius:5px;font-weight:400}
.acc-s{font-size:12px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-b{text-align:right;flex:none}
.acc-bv{font-size:15px;font-weight:600;letter-spacing:-.2px}
.acc-bv.neg{color:var(--expense)}
.acc-bs{font-size:11px;color:var(--text-3);margin-top:1px}
.acc-group{padding:11px 16px 7px;font-size:12px;color:var(--text-2);background:#FAFBFC;border-top:1px solid var(--line);font-weight:500;display:flex;align-items:center;gap:6px}
.acc-group b{color:var(--text);font-weight:600}
.net{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.net-c{background:var(--card);padding:14px 10px;text-align:center}
.net-l{font-size:12px;color:var(--text-2);margin-bottom:4px}
.net-v{font-size:18px;font-weight:600;letter-spacing:-.3px}
.bar-stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg);margin-top:12px}
.bar-stack i{display:block;height:100%}

/* ---------- 移动端底部导航 ---------- */
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mnav-in{display:flex;align-items:stretch;height:54px;max-width:520px;margin:0 auto}
.mnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--text-3);font-family:inherit;padding:0;cursor:pointer;min-width:44px}
.mnav button svg{width:21px;height:21px}
.mnav button.on{color:var(--brand)}
.mnav .mnav-add{flex:none;width:72px;position:relative;overflow:visible}
.mnav .mnav-add i{position:absolute;top:-17px;left:50%;margin-left:-24px;width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(59,110,151,.34)}
.mnav .mnav-add i svg{width:24px;height:24px}
.mnav .mnav-add em{margin-top:30px;font-style:normal;color:var(--brand)}

@media (min-width:900px){
  .mask{position:fixed;top:0;bottom:0;display:none;align-items:center;justify-content:center}
  .mask.on{display:flex}
  .sheet{max-height:88vh;min-height:0;border-radius:16px;overflow:hidden}
  .sh-body{padding-bottom:16px}
  .sh-foot{padding:12px 16px}
  .main-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .main-grid .col2{position:sticky;top:72px}
  .fab{right:calc(50vw - 560px + 20px)}
}
@media (max-width:899px){
  .main-grid{display:block}
  .main-grid .col2{margin-top:16px}
  /* 移动端：顶部 Tab 与右下悬浮按钮让位给底部导航栏 */
  .mnav{display:block}
  #tabsSec{display:none}
  .fab{display:none}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .boards{display:none}
  /* 触控目标放大到 44px 级别 */
  .chip{min-height:38px;padding:8px 14px}
  .navb{width:38px;height:38px}
  .btn{height:38px}
  .btn.sm{height:34px}
  .mi{padding:15px 4px}
  .seg button{height:38px}
  .tab{height:38px}
  .cf{margin:16vh auto 0}
  .cf-f button{height:52px}
}
@media (max-width:600px){
  .wrap{padding:0 12px}
  .sum-v{font-size:17px}
  .net-v{font-size:16px}
  .ov{grid-template-columns:repeat(2,1fr)}
  .cat-grid{grid-template-columns:repeat(4,1fr);gap:7px}
  .cat-b{font-size:11px;padding:9px 1px}
  .top-in{height:52px;gap:8px}
  .stg span{display:none}
  .stg{padding:5px 8px}
  .cal-cell{min-height:46px}
  .cal-cell .damt{font-size:9px}
  .dist-v{width:76px}
  .dist-n{width:46px}
  .cat-ics{grid-template-columns:repeat(6,1fr)}
  .sh-body{padding:14px 12px}
  .acc{padding:13px 12px}
  .acc-group{padding:11px 12px 7px}
}
/* 移动端弹层占满可视高度，避免 iOS 地址栏导致的 100vh 抖动 */
@supports (height:100dvh){
  @media (max-width:899px){ .sheet{min-height:100dvh} }
}

   2. 工具函数
   ============================================================ */
function pad2(n){ return String(n).padStart(2,'0'); }
function toStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function toDate(s){ var p=String(s).split('-'); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function addDays(s,n){ var d=toDate(s); d.setDate(d.getDate()+n); return toStr(d); }
function todayStr(){ return toStr(new Date()); }
function nowTime(){ var d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function monthKey(s){ return String(s).slice(0,7); }
function addMonths(key,n){
  var y=Number(key.slice(0,4)), m=Number(key.slice(5,7));
  var d=new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function weekStartOf(s){ var d=toDate(s); var wd=(d.getDay()+6)%7; return addDays(s,-wd); }
function weekKeyOf(s){ return 'W'+weekStartOf(s); }
function money(n){ var v=Math.abs(Number(n)||0); return '¥'+v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ var v=Math.round(Math.abs(Number(n)||0)); return '¥'+v.toLocaleString('zh-CN'); }
function moneyShort(n){
  var v=Number(n)||0;
  if(Math.abs(v)>=10000) return '¥'+(v/10000).toFixed(1)+'万';
  if(Math.abs(v)>=1000) return '¥'+(v/1000).toFixed(1)+'k';
  return '¥'+Math.round(v);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function weekdayCN(s){ return ['周日','周一','周二','周三','周四','周五','周六'][toDate(s).getDay()]; }
function weekdayShort(s){ return ['日','一','二','三','四','五','六'][toDate(s).getDay()]; }
function fmtDateCN(s){ var p=String(s).split('-'); return Number(p[1])+'月'+Number(p[2])+'日'; }
function svgIcon(name,size){ return '<svg viewBox="0 0 24 24" width="'+(size||20)+'" height="'+(size||20)+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(ICON[name]||ICON.other)+'</svg>'; }
function $(id){ return document.getElementById(id); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('on'); },1800); }

/* ============================================================
   2b. 内联 SVG 图表（纯函数，只返回字符串，不碰 DOM）
   ============================================================ */
function barChartSVG(rows, opts){
  opts = opts || {};
  var W=340, H=opts.height||150, padL=6, padR=6, top=12, labelH=30;
  var chartH = H - top - labelH;
  var n = rows.length;
  if(n===0) return '';
  var maxV = 0;
  for(var i=0;i<n;i++){ if(rows[i].value>maxV) maxV=rows[i].value; }
  if(maxV<=0) maxV=1;
  var slot = (W-padL-padR)/n, bw = Math.min(38, slot-10);
  var base = top+chartH;
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  if(opts.avg!=null && opts.avg>0){
    var ay = base - (opts.avg/maxV)*chartH;
    s += '<line x1="'+padL+'" y1="'+ay.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ay.toFixed(1)+'" stroke="#C98A2E" stroke-width="1" stroke-dasharray="4 3"/>';
    s += '<text x="'+(W-padR)+'" y="'+(ay-4).toFixed(1)+'" font-size="9" fill="#C98A2E" text-anchor="end">日均</text>';
  }
  for(var j=0;j<n;j++){
    var r = rows[j];
    var h = r.value>0 ? Math.max(3,(r.value/maxV)*chartH) : 2;
    var x = padL + j*slot + (slot-bw)/2;
    var y = base - h;
    var fill = r.over ? '#C25B54' : (r.value>0 ? '#8FB0C9' : '#E4E7EB');
    s += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+fill+'"'+(r.date?' data-date="'+r.date+'" style="cursor:pointer"':'')+'/>';
    if(r.value>0){
      s += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" fill="#6B7684" text-anchor="middle">'+moneyShort(r.value)+'</text>';
    }
    s += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(base+14)+'" font-size="10" fill="'+(r.today?'#3B6E97':'#6B7684')+'" text-anchor="middle" font-weight="'+(r.today?'600':'400')+'">'+esc(r.label)+'</text>';
    s += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(base+25)+'" font-size="9" fill="#9AA4AF" text-anchor="middle">'+esc(r.sub||'')+'</text>';
  }
  s += '</svg>';
  return s;
}

function donutSVG(rows, opts){
  opts = opts || {};
  var size=160, cx=80, cy=80, r=58, sw=22;
  var total = 0;
  for(var i=0;i<rows.length;i++) total += rows[i].value;
  if(total<=0) return '<div style="text-align:center;padding:30px 0;color:#9AA4AF;font-size:12px">暂无支出数据</div>';
  var C = 2*Math.PI*r, acc = 0;
  var s = '<svg viewBox="0 0 '+size+' '+size+'" role="img"><g transform="rotate(-90 '+cx+' '+cy+')">';
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#F0F2F4" stroke-width="'+sw+'"/>';
  for(var j=0;j<rows.length;j++){
    var frac = rows[j].value/total;
    var len = frac*C;
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+rows[j].color+'" stroke-width="'+sw+'"'
       + ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"/>';
    acc += len;
  }
  s += '</g>';
  s += '<text x="'+cx+'" y="'+(cy-4)+'" font-size="11" fill="#6B7684" text-anchor="middle">'+esc(opts.label||'合计')+'</text>';
  s += '<text x="'+cx+'" y="'+(cy+16)+'" font-size="17" font-weight="600" fill="#1F2933" text-anchor="middle">'+moneyShort(total)+'</text>';
  s += '</svg>';
  return s;
}

function ringSVG(rate, opts){
  opts = opts || {};
  var size=110, cx=55, cy=55, r=44, sw=10;
  var p = Math.max(0, Math.min(1.2, rate||0));
  var C = 2*Math.PI*r, len = Math.min(1,p)*C;
  var color = p>=1 ? '#C25B54' : (p>=0.8 ? '#C98A2E' : '#3F8A6B');
  var s = '<svg viewBox="0 0 '+size+' '+size+'" role="img"><g transform="rotate(-90 '+cx+' '+cy+')">';
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#F0F2F4" stroke-width="'+sw+'"/>';
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round"'
     + ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"/>';
  s += '</g>';
  s += '<text x="'+cx+'" y="'+(cy+2)+'" font-size="16" font-weight="600" fill="'+color+'" text-anchor="middle">'+Math.round(p*100)+'%</text>';
  s += '<text x="'+cx+'" y="'+(cy+18)+'" font-size="9" fill="#6B7684" text-anchor="middle">'+esc(opts.label||'')+'</text>';
  s += '</svg>';
  return s;
}

function lineChartSVG(points, opts){
  opts = opts || {};
  if(!points || points.length===0) return '';
  var W=340, H=130, padL=8, padR=8, top=14, bottom=26;
  var n=points.length, maxV=0;
  for(var i=0;i<n;i++){ if(points[i].value>maxV) maxV=points[i].value; }
  if(maxV<=0) maxV=1;
  var chartH = H-top-bottom;
  var step = n>1 ? (W-padL-padR)/(n-1) : 0;
  var pts = [];
  for(var j=0;j<n;j++){
    var x = padL + j*step;
    var y = top + chartH - (points[j].value/maxV)*chartH;
    pts.push([x,y]);
  }
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  s += '<line x1="'+padL+'" y1="'+(top+chartH)+'" x2="'+(W-padR)+'" y2="'+(top+chartH)+'" stroke="#E4E7EB" stroke-width="1"/>';
  var d = '';
  for(var k=0;k<pts.length;k++){ d += (k===0?'M':'L')+pts[k][0].toFixed(1)+' '+pts[k][1].toFixed(1); }
  s += '<path d="'+d+'" fill="none" stroke="#3B6E97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  for(var m=0;m<pts.length;m++){
    s += '<circle cx="'+pts[m][0].toFixed(1)+'" cy="'+pts[m][1].toFixed(1)+'" r="3" fill="#fff" stroke="#3B6E97" stroke-width="2"/>';
    s += '<text x="'+pts[m][0].toFixed(1)+'" y="'+(top+chartH+16)+'" font-size="9" fill="#9AA4AF" text-anchor="middle">'+esc(points[m].label)+'</text>';
    s += '<text x="'+pts[m][0].toFixed(1)+'" y="'+(pts[m][1]-9).toFixed(1)+'" font-size="9" fill="#6B7684" text-anchor="middle">'+moneyShort(points[m].value)+'</text>';
  }
  s += '</svg>';
  return s;
}

/* ============================================================
   3. 存储层 —— 可插拔适配器
   ============================================================ */
var LocalAdapter = {
  name:'本地存储',
  load:function(){
    try{ var raw=localStorage.getItem(CONFIG.storage.localKey); return raw?JSON.parse(raw):null; }
    catch(e){ console.warn('读取本地数据失败',e); return null; }
  },
  save:function(data){
    try{ localStorage.setItem(CONFIG.storage.localKey, JSON.stringify(data)); return true; }
    catch(e){ toast('存储空间不足，请导出备份后清理'); return false; }
  },
  status:function(){ return 'local'; },
  statusText:function(){ return '本地存储'; }
};
var CloudAdapter = {
  name:'云端',
  load:function(){ return null; },
  save:function(data){ return false; },
  status:function(){ return 'offline'; },
  statusText:function(){ return '云端未接入'; }
};
/* 远端适配器：http(s) 下连本地 MySQL 后端（server.py）。
   读取：优先远端快照，失败则用本地镜像（永不卡死）。
   写入：先落本地镜像，再防抖同步远端；远端挂了也不丢数据。 */
function syncGet(url){
  var xhr=new XMLHttpRequest();
  xhr.open('GET', url, false);
  xhr.send();
  if(xhr.status>=200 && xhr.status<300) return JSON.parse(xhr.responseText);
  throw new Error('HTTP '+xhr.status);
}
function syncPost(url, data){
  var xhr=new XMLHttpRequest();
  xhr.open('POST', url, false);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.send(JSON.stringify({ data:data }));
  if(xhr.status<200 || xhr.status>=300) throw new Error('HTTP '+xhr.status);
  return true;
}
var RemoteAdapter = {
  name:'云端同步(MySQL)',
  _ok:true, _busy:false, _timer:null,
  load:function(){
    try{
      var snap=syncGet(CONFIG.storage.api);
      if(snap){
        var db=(snap.data)?snap.data:snap;   // 兼容 {ok:true,data:快照} 与直接快照两种返回
        if(db && db.settings && db.records){ this._ok=true; return db; }
      }
    }catch(e){ console.warn('远端读取失败，使用本地镜像', e); }
    this._ok=false;
    return LocalAdapter.load();
  },
  save:function(data){
    LocalAdapter.save(data);
    var self=this;
    this._timer=setTimeout(function(){
      if(self._busy) return;
      self._busy=true;
      try{ syncPost(CONFIG.storage.api, data); self._ok=true; }
      catch(e){ self._ok=false; console.warn('远端同步失败，已留本地镜像', e); }
      self._busy=false;
    }, 500);
    return true;
  },
  status:function(){ return this._ok?'cloud':'local'; },
  statusText:function(){ return this._ok?'云端同步(MySQL)':'本地存储(同步失败)'; }
};
var Storage;
if(CONFIG.storage.mode==='cloud'){
  Storage = CloudAdapter;
}else if(CONFIG.storage.mode==='auto'){
  var _proto = (typeof location!=='undefined' && location.protocol) || 'file:';
  Storage = (_proto==='http:'||_proto==='https:') ? RemoteAdapter : LocalAdapter;
}else{
  Storage = LocalAdapter;
}

/* 老数据兼容：账户曾是「名字数组」，记录里 account 存的是名字。
   升级为对象数组（带 id），并把记录里的名字映射成 id，保证余额派生一致。 */
function migrateAccountsIfNeeded(){
  var as = DB.settings.accounts;
  if(!as || !as.length) return;
  if(typeof as[0] !== 'string'){
    // 已是对象，仅需补全可能缺失的字段
    for(var i=0;i<as.length;i++){
      var a=as[i];
      if(a.initBalance==null) a.initBalance=0;
      if(a.inTotal==null) a.inTotal=1;
      if(a.archived==null) a.archived=0;
      if(a.sort==null) a.sort=i+1;
      if(!a.kind) a.kind='other';
    }
    return;
  }
  var known={ '微信':'wechat','支付宝':'alipay','现金':'cash','银行卡':'debit','信用卡':'credit','余额宝':'yuebao','其他':'other' };
  var map={}, objs=[];
  for(var j=0;j<as.length;j++){
    var nm=as[j], id=known[nm]||('acc'+(j+1));
    map[nm]=id;
    objs.push({id:id,name:nm,kind:'other',icon:'other',color:'#8A94A0',initBalance:0,creditLimit:0,billDay:0,repayDay:0,cardTail:'',inTotal:1,archived:0,sort:j+1,note:''});
  }
  DB.settings.accounts=objs;
  for(var k=0;k<DB.records.length;k++){
    var r=DB.records[k];
    if(r.toAccount==null) r.toAccount='';
    if(r.account && map[r.account]!=null) r.account=map[r.account];
    if(r.toAccount && map[r.toAccount]!=null) r.toAccount=map[r.toAccount];
  }
  saveDB();
}

function getRecords(){ return (DB.records||[]).filter(function(r){ return !r.deleted; }); }
function findRecord(id){
  for(var i=0;i<DB.records.length;i++){ if(DB.records[i].id===id) return DB.records[i]; }
  return null;
}
function addRecord(obj){
  var t=new Date().getTime();
  var r={
    id:uid(), date:obj.date, time:obj.time||nowTime(), type:obj.type,
    amount:Math.round(Number(obj.amount)*100)/100,
    category:obj.category, subCategory:obj.subCategory||'', account:obj.account||'',
    toAccount:obj.toAccount||'', merchant:obj.merchant||'', tags:obj.tags||[], scene:obj.scene||'',
    isFixed:!!obj.isFixed, note:obj.note||'',
    createdAt:t, updatedAt:t, deleted:false
  };
  DB.records.push(r); saveDB(); return r;
}
function updateRecord(id,obj){
  var r=findRecord(id); if(!r) return null;
  r.date=obj.date; r.time=obj.time||r.time; r.type=obj.type;
  r.amount=Math.round(Number(obj.amount)*100)/100;
  r.category=obj.category; r.subCategory=obj.subCategory||'';
  r.account=obj.account||''; r.toAccount=obj.toAccount||''; r.merchant=obj.merchant||'';
  r.tags=obj.tags||[]; r.scene=obj.scene||'';
  r.isFixed=!!obj.isFixed; r.note=obj.note||'';
  r.updatedAt=new Date().getTime();
  saveDB(); return r;
}
function deleteRecord(id){
  var r=findRecord(id); if(!r) return false;
  r.deleted=true; r.updatedAt=new Date().getTime(); saveDB(); return true;
}
function getNote(scope,key){
  for(var i=0;i<DB.notes.length;i++){ var n=DB.notes[i]; if(n.scope===scope&&n.periodKey===key) return n; }
  return null;
}
function saveNoteContent(scope,key,content){
  var n=getNote(scope,key);
  if(!n){ n={scope:scope,periodKey:key,content:'',autoSummary:'',summaryLocked:false,updatedAt:0}; DB.notes.push(n); }
  n.content=content; n.updatedAt=new Date().getTime(); saveDB(); return n;
}

/* ============================================================
   5. 计算层
   ============================================================ */
function catById(id){
  var cs=DB.settings.categories;
  for(var i=0;i<cs.length;i++){ if(cs[i].id===id) return cs[i]; }
  return {id:'other', name:'其他', color:'#8A94A0', icon:'other', subs:[]};
}
/* ---------- 资金账户：派生余额 ---------- */
function accById(id){
  var as=DB.settings.accounts||[];
  for(var i=0;i<as.length;i++){ if(as[i].id===id) return as[i]; }
  return null;
}
function accName(id){ var a=accById(id); return a?a.name:'未分配账户'; }
function accKindLabel(kind){
  return {cash:'现金',debit:'储蓄卡',credit:'信用卡',wallet:'钱包',invest:'理财',other:'其他'}[kind]||'其他';
}
function accList(){   /* 未归档、按 sort 排序 */
  return (DB.settings.accounts||[]).filter(function(a){ return !a.archived; }).sort(function(a,b){ return (a.sort||0)-(b.sort||0); });
}
function accOptions(){ /* 编辑记录时可选全部账户（含归档，避免老记录账户消失） */
  return (DB.settings.accounts||[]).slice().sort(function(a,b){ return (a.sort||0)-(b.sort||0); });
}
/* 余额 = 初始余额 + 入账 - 支出 - 转出 + 转入（与 MySQL 派生公式一致，不落库） */
function accountBalance(id){
  var a=accById(id);
  var bal = (a && typeof a.initBalance==='number') ? a.initBalance : 0;
  var rs=getRecords();
  for(var i=0;i<rs.length;i++){
    var r=rs[i];
    if(r.type==='income' && r.account===id) bal+=Number(r.amount)||0;
    else if(r.type==='expense' && r.account===id) bal-=Number(r.amount)||0;
    else if(r.type==='transfer'){
      if(r.account===id) bal-=Number(r.amount)||0;       // 转出
      if(r.toAccount===id) bal+=Number(r.amount)||0;      // 转入
    }
  }
  return Math.round(bal*100)/100;
}
/* 净资产 = 总资产 - 总负债（信用类负数余额记为负债） */
function netWorth(){
  var assets=0, liab=0, list=accList();
  for(var i=0;i<list.length;i++){
    var a=list[i], b=accountBalance(a.id);
    if(!a.inTotal) continue;
    if(a.kind==='credit'){ if(b<0) liab+=-b; else assets+=b; }
    else { assets+=b; }
  }
  return { assets:Math.round(assets*100)/100, liabilities:Math.round(liab*100)/100, net:Math.round((assets-liab)*100)/100 };
}
function sumBal(list){ var s=0; for(var i=0;i<list.length;i++) s+=accountBalance(list[i].id); return Math.round(s*100)/100; }
function recordsOn(d){ return getRecords().filter(function(r){ return r.date===d; }).sort(function(a,b){ return (b.time||'').localeCompare(a.time||''); }); }
function recordsBetween(a,b){ return getRecords().filter(function(r){ return r.date>=a && r.date<=b; }); }
function sumBy(list,type){ var s=0; for(var i=0;i<list.length;i++){ if(list[i].type===type) s+=Number(list[i].amount)||0; } return s; }

function dayStats(d){
  var list=recordsOn(d);
  var e=sumBy(list,'expense'), i=sumBy(list,'income');
  return { list:list, expense:e, income:i, balance:i-e, count:list.length };
}
function weekStats(startDate){
  var end=addDays(startDate,6);
  var list=recordsBetween(startDate,end);
  var e=sumBy(list,'expense'), i=sumBy(list,'income');
  return { start:startDate, end:end, list:list, expense:e, income:i, balance:i-e, count:list.length };
}
function monthStats(key){
  var ms=getRecords().filter(function(r){ return monthKey(r.date)===key; });
  var e=sumBy(ms,'expense'), i=sumBy(ms,'income');
  return { key:key, list:ms, expense:e, income:i, balance:i-e, count:ms.length };
}
function catDist(list){
  var map={}, total=0;
  for(var i=0;i<list.length;i++){
    var r=list[i];
    if(r.type!=='expense') continue;
    map[r.category]=(map[r.category]||0)+(Number(r.amount)||0);
    total+=Number(r.amount)||0;
  }
  var arr=[];
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map,k)) arr.push({id:k,value:map[k]}); }
  arr.sort(function(a,b){ return b.value-a.value; });
  return { rows:arr, total:total };
}
function tagDist(list){
  var map={}, total=0;
  for(var i=0;i<list.length;i++){
    var r=list[i];
    if(r.type!=='expense') continue;
    var tg=(r.tags&&r.tags.length)?r.tags:['未标记'];
    for(var j=0;j<tg.length;j++){ map[tg[j]]=(map[tg[j]]||0)+(Number(r.amount)||0); }
    total+=Number(r.amount)||0;
  }
  var arr=[];
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map,k)) arr.push({name:k,value:map[k]}); }
  arr.sort(function(a,b){ return b.value-a.value; });
  return { rows:arr, total:total };
}
function accountDist(list){
  var map={}, total=0;
  for(var i=0;i<list.length;i++){
    var r=list[i];
    if(r.type!=='expense') continue;
    var a=accName(r.account||'');
    map[a]=(map[a]||0)+(Number(r.amount)||0);
    total+=Number(r.amount)||0;
  }
  var arr=[];
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map,k)) arr.push({name:k,value:map[k]}); }
  arr.sort(function(a,b){ return b.value-a.value; });
  return { rows:arr, total:total };
}
function merchantTop(list,n){
  var map={}, total=0;
  for(var i=0;i<list.length;i++){
    var r=list[i];
    if(r.type!=='expense'||!r.merchant) continue;
    map[r.merchant]=(map[r.merchant]||0)+(Number(r.amount)||0);
    total+=Number(r.amount)||0;
  }
  var arr=[];
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map,k)) arr.push({name:k,value:map[k]}); }
  arr.sort(function(a,b){ return b.value-a.value; });
  return { rows:arr.slice(0,n||5), total:total };
}
function monthTrend(count){
  var out=[], cur=monthKey(todayStr());
  for(var i=(count||6)-1;i>=0;i--){
    var k=addMonths(cur,-i);
    var ms=monthStats(k);
    out.push({ label:Number(k.slice(5,7))+'月', value:ms.expense, key:k });
  }
  return out;
}
function dayAvgOfMonth(key){
  var m=monthStats(key);
  var y=Number(key.slice(0,4)), mo=Number(key.slice(5,7));
  return m.expense/Math.max(1,daysInMonth(y,mo));
}
function calcStreak(){
  var dates={}, rs=getRecords();
  for(var i=0;i<rs.length;i++){ dates[rs[i].date]=true; }
  var n=0, cur=todayStr();
  if(!dates[cur]) cur=addDays(cur,-1);
  while(dates[cur]){ n++; cur=addDays(cur,-1); }
  return n;
}
function budgetUsage(){
  var b=DB.settings.budget;
  if(!b||!b.enabled||!b.amount) return null;
  var used=monthStats(monthKey(todayStr())).expense;
  return { amount:Number(b.amount), used:used, rate:used/Number(b.amount) };
}
function buildTodoItems(){
  var items=[];
  var today=todayStr(), yd=addDays(today,-1);
  var ignored=DB.settings.ignoredMissDays||[];
  if(recordsOn(yd).length===0 && ignored.indexOf(yd)<0){
    (function(d){
      items.push({ level:'warn', text:'昨天（'+fmtDateCN(d)+'）还没有记账', btn:'去补记',
        act:function(){ state.date=d; state.view='day'; openEdit(null); } });
    })(yd);
  }
  if(recordsOn(today).length===0){
    items.push({ level:'info', text:'今天还没有记账', btn:'记一笔',
      act:function(){ state.date=today; state.view='day'; openEdit(null); } });
  }
  var big=recordsOn(today).filter(function(r){ return r.type==='expense'&&Number(r.amount)>=CONFIG.bigAmount; });
  if(big.length>0){
    (function(id){
      items.push({ level:'info', text:'今天有 '+big.length+' 笔大额支出（≥'+money0(CONFIG.bigAmount)+'）', btn:'查看',
        act:function(){ state.flashId=id; state.date=today; state.view='day'; refreshAll(); } });
    })(big[0].id);
  }
  var bu=budgetUsage();
  if(bu&&bu.rate>=0.8){
    items.push({ level:bu.rate>=1?'warn':'info',
      text:'本月预算已用 '+Math.round(bu.rate*100)+'%，剩余 '+money0(bu.amount-bu.used), btn:'知道了', act:function(){} });
  }
  var st=calcStreak();
  if(st>=CONFIG.streakMin) items.push({ level:'good', text:'已连续记账 '+st+' 天，保持住' });
  return items;
}

/* 自动总结：日 / 周 / 月 */
function autoSummaryOf(scope,key){
  if(scope==='day'){
    var s=dayStats(key);
    if(s.count===0) return '这天还没有记账记录。';
    var parts=['<b>'+fmtDateCN(key)+'</b> 共 '+s.count+' 笔'];
    if(s.expense>0) parts.push('支出 '+money(s.expense));
    if(s.income>0) parts.push('收入 '+money(s.income));
    var txt=parts.join('，')+'。';
    var ex=s.list.filter(function(r){ return r.type==='expense'; });
    if(ex.length>0){
      var max=ex[0];
      for(var i=1;i<ex.length;i++){ if(Number(ex[i].amount)>Number(max.amount)) max=ex[i]; }
      txt+=' 最大一笔是'+catById(max.category).name+' '+money0(max.amount);
      if(max.merchant) txt+='（'+esc(max.merchant)+'）';
      txt+='。';
    }
    var avg=dayAvgOfMonth(monthKey(key));
    if(s.expense>0&&avg>0){
      var diff=s.expense-avg;
      txt+= diff>0 ? ' 比本月日均高 '+money0(diff)+'。' : ' 比本月日均低 '+money0(-diff)+'。';
    }
    return txt;
  }
  if(scope==='week'){
    var w=weekStats(String(key).slice(1));
    if(w.count===0) return '这一周还没有记账记录。';
    var prev=weekStats(addDays(w.start,-7));
    var txt='<b>'+fmtDateCN(w.start)+' - '+fmtDateCN(w.end)+'</b> 共 '+w.count+' 笔，支出 '+money(w.expense);
    if(w.income>0) txt+='，收入 '+money(w.income);
    txt+='。';
    if(prev.expense>0){
      var r=(w.expense-prev.expense)/prev.expense;
      if(Math.abs(r)>=0.01){
        txt+=' 环比上周'+(r>0?'增加':'减少')+' '+Math.abs(Math.round(r*100))+'%。';
      }else{ txt+=' 与上周基本持平。'; }
    }
    var cd=catDist(w.list);
    if(cd.rows.length>0){
      txt+=' 最大支出是'+catById(cd.rows[0].id).name+'，'+money0(cd.rows[0].value)+'，占 '+Math.round(cd.rows[0].value/cd.total*100)+'%。';
    }
    var byDay={}, topDay='', topV=0;
    for(var i2=0;i2<w.list.length;i2++){
      var r2=w.list[i2];
      if(r2.type!=='expense') continue;
      byDay[r2.date]=(byDay[r2.date]||0)+(Number(r2.amount)||0);
    }
    for(var k in byDay){ if(Object.prototype.hasOwnProperty.call(byDay,k)&&byDay[k]>topV){ topV=byDay[k]; topDay=k; } }
    if(topDay) txt+=' '+weekdayCN(topDay)+'花得最多，'+money0(topV)+'。';
    return txt;
  }
  if(scope==='month'){
    var m=monthStats(key);
    if(m.count===0) return '这个月还没有记账记录。';
    var pm=monthStats(addMonths(key,-1));
    var t='<b>'+Number(key.slice(0,4))+'年'+Number(key.slice(5,7))+'月</b> 共 '+m.count+' 笔，支出 '+money(m.expense);
    if(m.income>0) t+='，收入 '+money(m.income);
    t+='，结余 '+money(m.balance)+'。';
    if(pm.expense>0){
      var rr=(m.expense-pm.expense)/pm.expense;
      if(Math.abs(rr)>=0.01) t+=' 环比上月'+(rr>0?'增加':'减少')+' '+Math.abs(Math.round(rr*100))+'%。';
    }
    var cm=catDist(m.list);
    if(cm.rows.length>0){
      var top3=cm.rows.slice(0,3).map(function(x){ return catById(x.id).name; });
      var s3=0;
      for(var q=0;q<Math.min(3,cm.rows.length);q++) s3+=cm.rows[q].value;
      t+=' 前三名是'+top3.join('、')+'，合计占 '+Math.round(s3/cm.total*100)+'%。';
    }
    var td=tagDist(m.list);
    var flex=0;
    for(var z=0;z<td.rows.length;z++){
      if(td.rows[z].name==='非必要'||td.rows[z].name==='冲动') flex+=td.rows[z].value;
    }
    if(td.total>0&&flex>0){
      t+=' 其中「非必要+冲动」共 '+money0(flex)+'，占 '+Math.round(flex/td.total*100)+'%。';
    }
    return t;
  }
  return '';
}

function renderSum(){
  if(state.view==='day') renderSumDay();
  else if(state.view==='week') renderSumWeek();
  else if(state.view==='asset') renderSumAsset();
  else renderSumMonth();
}
function renderSumDay(){
  var s=dayStats(state.date);
  var avg=dayAvgOfMonth(monthKey(state.date));
  var sub='';
  if(s.expense>0&&avg>0){ var diff=s.expense-avg; sub=diff>0?('高于日均 '+money0(diff)):('低于日均 '+money0(-diff)); }
  $('sumArea').innerHTML='<div class="sum">'
    +'<div class="sum-c"><div class="sum-l">支出</div><div class="sum-v e num">'+money(s.expense)+'</div><div class="sum-sub">'+(sub||'&nbsp;')+'</div></div>'
    +'<div class="sum-c"><div class="sum-l">收入</div><div class="sum-v i num">'+money(s.income)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'<div class="sum-c"><div class="sum-l">结余</div><div class="sum-v num" style="color:'+(s.balance<0?'var(--expense)':'var(--income)')+'">'+money(s.balance)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'</div>';
}
function renderSumWeek(){
  var ws=weekStartOf(state.date);
  var w=weekStats(ws);
  var prev=weekStats(addDays(ws,-7));
  var extra='';
  if(prev.expense>0){
    var r=(w.expense-prev.expense)/prev.expense;
    if(Math.abs(r)>=0.01){
      extra='<div class="sum-extra">环比上周 <b class="'+(r>0?'up':'down')+'">'+(r>0?'↑':'↓')+' '+Math.abs(Math.round(r*100))+'%</b>　日均 '+money0(w.expense/7)+'</div>';
    }else{ extra='<div class="sum-extra">与上周基本持平　日均 '+money0(w.expense/7)+'</div>'; }
  }else{
    extra='<div class="sum-extra">日均 '+money0(w.expense/7)+'</div>';
  }
  $('sumArea').innerHTML='<div class="sum">'
    +'<div class="sum-c"><div class="sum-l">本周支出</div><div class="sum-v e num">'+money(w.expense)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'<div class="sum-c"><div class="sum-l">本周收入</div><div class="sum-v i num">'+money(w.income)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'<div class="sum-c"><div class="sum-l">结余</div><div class="sum-v num" style="color:'+(w.balance<0?'var(--expense)':'var(--income)')+'">'+money(w.balance)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'</div>'+extra;
}
function renderSumMonth(){
  var mk=monthKey(state.date);
  var m=monthStats(mk);
  var extra='';
  var bu=(mk===monthKey(todayStr()))?budgetUsage():null;
  if(bu){
    extra='<div class="sum-extra">月预算 '+money0(bu.amount)+'　已用 <b class="'+(bu.rate>=1?'up':(bu.rate>=0.8?'':'down'))+'">'+Math.round(bu.rate*100)+'%</b>　剩余 '+money0(bu.amount-bu.used)+'</div>';
  }else{
    var pm=monthStats(addMonths(mk,-1));
    if(pm.expense>0){
      var r=(m.expense-pm.expense)/pm.expense;
      if(Math.abs(r)>=0.01) extra='<div class="sum-extra">环比上月 <b class="'+(r>0?'up':'down')+'">'+(r>0?'↑':'↓')+' '+Math.abs(Math.round(r*100))+'%</b></div>';
    }
  }
  $('sumArea').innerHTML='<div class="sum">'
    +'<div class="sum-c"><div class="sum-l">本月支出</div><div class="sum-v e num">'+money(m.expense)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'<div class="sum-c"><div class="sum-l">本月收入</div><div class="sum-v i num">'+money(m.income)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'<div class="sum-c"><div class="sum-l">结余</div><div class="sum-v num" style="color:'+(m.balance<0?'var(--expense)':'var(--income)')+'">'+money(m.balance)+'</div><div class="sum-sub">&nbsp;</div></div>'
    +'</div>'+extra;
}

function accGroupHTML(title, list){
  if(!list.length) return '';
  var html='<div class="acc-group"><b>'+esc(title)+'</b><span style="margin-left:auto">'+money(sumBal(list))+'</span></div>';
  for(var i=0;i<list.length;i++){
    var a=list[i], b=accountBalance(a.id), neg=b<0;
    var sub=(a.kind==='credit'&&a.creditLimit)?('额度 '+money0(a.creditLimit)):('初始 '+money(a.initBalance));
    html+='<button class="acc" data-acc="'+esc(a.id)+'">'
      +'<span class="acc-ic" style="background:'+a.color+'1A;color:'+a.color+'">'+svgIcon(a.icon,20)+'</span>'
      +'<span class="acc-main"><span class="acc-n">'+esc(a.name)+' <span class="acc-tag">'+accKindLabel(a.kind)+'</span></span>'
      +'<span class="acc-s">'+sub+'</span></span>'
      +'<span class="acc-b"><span class="acc-bv'+(neg?' neg':'')+'">'+money(b)+'</span>'
      +'<span class="acc-bs">'+(neg?'欠款':'余额')+'</span></span></button>';
  }
  return html;
}
function renderMainAsset(){
  var assets=accList().filter(function(a){ return a.kind!=='credit'; });
  var debts=accList().filter(function(a){ return a.kind==='credit'; });
  var nw=netWorth();
  var html='<div class="card pad" style="margin:14px 16px 0">'
    +'<div style="font-size:12px;color:var(--text-2)">净资产（总资产 − 总负债）</div>'
    +'<div style="font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:2px">'+money(nw.net)+'</div>'
    +'<div class="bar-stack">';
  var totalPos=nw.assets>0?nw.assets:1;
  for(var i=0;i<assets.length;i++){
    var b=accountBalance(assets[i].id);
    if(b<=0) continue;
    var pct=Math.max(2, Math.round(b/totalPos*100));
    html+='<i style="width:'+pct+'%;background:'+assets[i].color+'"></i>';
  }
  html+='</div></div>';
  html+=accGroupHTML('资产', assets);
  if(debts.length) html+=accGroupHTML('负债', debts);
  html+='<button class="acc" id="addAcc" style="justify-content:center;color:var(--brand);font-weight:500">'
    +'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> 添加资金账户</button>';
  $('mainArea').innerHTML=html;
  var add=$('addAcc'); if(add) add.addEventListener('click',function(){ openAccEditor(null); });
  var rows=$('mainArea').querySelectorAll('.acc[data-acc]');
  for(var k=0;k<rows.length;k++){
    (function(el){ el.addEventListener('click',function(){ openAccEditor(el.getAttribute('data-acc')); }); })(rows[k]);
  }
}
function renderStatsAsset(){
  var list=accList().filter(function(a){ return accountBalance(a.id)>0; });
  var rows=list.map(function(a){ return {name:a.name, value:accountBalance(a.id), color:a.color}; });
  var html='<h3 class="sec-t">资金分布</h3>';
  if(rows.length) html+=donutSVG(rows,{label:'账户'});
  else html+='<div style="text-align:center;padding:24px 0;color:#9AA4AF;font-size:12px">暂无正余额账户</div>';
  $('statsArea').innerHTML=html;
}

/* ---------- 资金账户增删改 + 余额对账 ---------- */
var accDraft=null;
var ACC_KINDS=[
  {kind:'cash',name:'现金'},{kind:'debit',name:'储蓄卡'},{kind:'credit',name:'信用卡'},
  {kind:'wallet',name:'钱包'},{kind:'invest',name:'理财'},{kind:'other',name:'其他'}
];
var KIND_DEF={
  cash:{icon:'cash',color:'#C98A2E'}, debit:{icon:'bank',color:'#3B6E97'},
  credit:{icon:'creditcard',color:'#C25B54'}, wallet:{icon:'wallet',color:'#3F8A6B'},
  invest:{icon:'invest',color:'#4E8C8C'}, other:{icon:'other',color:'#8A94A0'}
};
function openAccEditor(id){
  if(id){
    var a=accById(id);
    if(!a){ toast('账户不存在'); return; }
    accDraft=JSON.parse(JSON.stringify(a));
  }else{
    var maxSort=0; (DB.settings.accounts||[]).forEach(function(x){ if((x.sort||0)>maxSort) maxSort=x.sort; });
    accDraft={id:'acc'+Date.now().toString(36), name:'', kind:'wallet', icon:'wallet', color:'#3F8A6B',
      initBalance:0, creditLimit:0, billDay:0, repayDay:0, cardTail:'', inTotal:1, archived:0, sort:maxSort+1, note:''};
  }
  renderAccSheet();
}
function renderAccSheet(){
  var a=accDraft;
  var kindChips=ACC_KINDS.map(function(k){
    return '<button class="chip'+(k.kind===a.kind?' on':'')+'" data-kind="'+k.kind+'">'+k.name+'</button>';
  }).join('');
  var editing = a.id && accById(a.id);
  var html='<div class="sh-head"><button class="btn ghost sm" id="accCancel">取消</button>'
    +'<h3>'+(editing?'编辑账户':'添加账户')+'</h3>'
    +'<span style="width:44px"></span></div><div class="sh-body">'
    +'<div class="fld"><span class="lb">名称</span><input class="inp" id="accName" type="text" placeholder="如：微信、招行储蓄卡" value="'+esc(a.name)+'"></div>'
    +'<div class="fld"><span class="lb">类型</span><div class="chips" id="accKinds">'+kindChips+'</div></div>'
    +'<div class="fld"><span class="lb">'+(a.kind==='credit'?'初始欠款（负）':'初始余额')+'</span>'
    +'<input class="amt-in num" id="accInit" type="number" step="0.01" value="'+esc(a.initBalance)+'"></div>'
    +(a.kind==='credit'?'<div class="fld"><span class="lb">信用额度</span><input class="amt-in num" id="accLimit" type="number" step="0.01" value="'+esc(a.creditLimit)+'"></div>':'')
    +'<label class="chk" style="margin:4px 0 10px"><input type="checkbox" id="accInTotal"'+(a.inTotal?' checked':'')+'>计入净资产</label>'
    +'<div class="fld"><span class="lb">备注（选填）</span><input class="inp" id="accNote" type="text" value="'+esc(a.note)+'"></div>'
    +(editing?('<div class="card pad" style="margin:6px 0 12px"><div style="font-size:12px;color:var(--text-2)">余额对账（当前派生余额 '+money(accountBalance(a.id))+'）</div>'
      +'<div style="display:flex;gap:8px;margin-top:8px"><input class="amt-in num" id="accReal" type="number" step="0.01" placeholder="实际余额"><button class="btn" id="accReconcile">一键对账</button></div>'
      +'<div class="hint">与流水派生余额不一致时，填入真实余额自动生成调整记录。</div></div>'):'')
    +'<div class="hint">余额 = 初始余额 + 入账 − 支出 − 转出 + 转入，由流水实时算出，不手动改。</div>'
    +'</div><div class="sh-foot">'
    +(editing?'<button class="btn" id="accDel" style="color:var(--expense)">删除</button>':'')
    +'<button class="btn primary" id="accSave">'+(editing?'保存':'添加')+'</button></div>';
  $('sheetAcc').innerHTML=html;
  $('maskAcc').classList.add('on');
  document.body.style.overflow='hidden';
  bindAccEvents();
}
function bindAccEvents(){
  var kc=$('accKinds').querySelectorAll('[data-kind]');
  for(var i=0;i<kc.length;i++){
    (function(btn){ btn.addEventListener('click',function(){
      accDraft.kind=btn.getAttribute('data-kind');
      var def=KIND_DEF[accDraft.kind];
      accDraft.icon=def.icon; accDraft.color=def.color;
      renderAccSheet();
    }); })(kc[i]);
  }
  $('accCancel').addEventListener('click',closeAccEditor);
  var save=$('accSave'); if(save) save.addEventListener('click',saveAcc);
  var del=$('accDel'); if(del) del.addEventListener('click',function(){
    confirmBox({ title:'删除该账户？', desc:'已用该账户的记录会保留，账户归为「其他」。', okText:'删除', danger:true,
      onOk:function(){ deleteAcc(accDraft.id); } });
  });
  var rec=$('accReconcile'); if(rec) rec.addEventListener('click',reconcileAcc);
}
function saveAcc(){
  accDraft.name=($('accName').value||'').trim();
  accDraft.initBalance=Number($('accInit').value)||0;
  accDraft.creditLimit=Number(($('accLimit')&&$('accLimit').value)||0)||0;
  accDraft.inTotal=$('accInTotal')?$('accInTotal').checked:1;
  accDraft.note=($('accNote').value||'').trim();
  if(!accDraft.name){ toast('请填写账户名称'); return; }
  var existing=accById(accDraft.id);
  if(existing){
    for(var k in accDraft){ if(Object.prototype.hasOwnProperty.call(accDraft,k)) existing[k]=accDraft[k]; }
    saveDB(); closeAccEditor(); refreshAll(); toast('已保存');
  }else{
    DB.settings.accounts.push(accDraft); saveDB(); closeAccEditor(); refreshAll(); toast('已添加账户');
  }
}
function deleteAcc(id){
  var existing=accById(id);
  if(!existing){ closeAccEditor(); return; }
  var fallback=(DB.settings.accounts||[]).filter(function(x){ return x.id!==id; })[0];
  var fid=fallback?fallback.id:'other';
  for(var i=0;i<DB.records.length;i++){
    if(DB.records[i].account===id) DB.records[i].account=fid;
    if(DB.records[i].toAccount===id) DB.records[i].toAccount=fid;
  }
  DB.settings.accounts=DB.settings.accounts.filter(function(x){ return x.id!==id; });
  saveDB(); closeAccEditor(); refreshAll(); toast('已删除账户');
}
function reconcileAcc(){
  var real=Number(($('accReal')&&$('accReal').value)||'');
  if(isNaN(real)){ toast('请输入实际余额'); return; }
  var cur=accountBalance(accDraft.id);
  var diff=Math.round((real-cur)*100)/100;
  if(diff===0){ toast('余额已一致，无需调整'); return; }
  var t=new Date().getTime();
  var rec={
    id:uid(), date:todayStr(), time:nowTime(), type:'transfer', amount:Math.abs(diff),
    category:'adjust', subCategory:'对账差额', account: diff<0?accDraft.id:'', toAccount: diff>0?accDraft.id:'',
    merchant:'余额调整', tags:[], scene:'日常', isFixed:false, note:'对账：'+money(cur)+'→'+money(real),
    createdAt:t, updatedAt:t, deleted:false
  };
  DB.records.push(rec); saveDB(); closeAccEditor(); refreshAll(); toast('已对账，差额 '+money(Math.abs(diff))+' 已记录');
}
function closeAccEditor(){
  $('maskAcc').classList.remove('on'); document.body.style.overflow=''; $('sheetAcc').innerHTML=''; accDraft=null;
}

function renderMain(){
  if(state.view==='day') renderMainDay();
  else if(state.view==='week') renderMainWeek();
  else if(state.view==='asset') renderMainAsset();
  else renderMainMonth();
}
function recRowHTML(r){
  var c=catById(r.category);
  var isE=r.type==='expense';
  var isT=r.type==='transfer';
  var meta=[];
  if(r.time) meta.push(r.time);
  if(r.type==='transfer'){
    if(r.account) meta.push(accName(r.account)+(r.toAccount?(' → '+accName(r.toAccount)):''));
  }else if(r.account){
    meta.push(accName(r.account));
  }
  if(r.merchant) meta.push(r.merchant);
  if(r.note) meta.push(r.note);
  if(r.isFixed) meta.push('固定');
  var tagTxt=(r.tags&&r.tags.length)?' <span class="tag-dot" style="background:'+(r.tags.indexOf('冲动')>=0?'var(--expense)':'var(--text-3)')+'"></span>'+esc(r.tags.join('/')):'';
  return '<div class="rec'+(state.flashId===r.id?' flash':'')+'" data-id="'+r.id+'">'
    +'<div class="rec-ic" style="background:'+c.color+'1A;color:'+c.color+'">'+svgIcon(c.icon,18)+'</div>'
    +'<div class="rec-main"><div class="rec-t"><span class="cat">'+esc(c.name)+'</span>'
    +(r.subCategory?'<span class="sub">'+esc(r.subCategory)+'</span>':'')
    +'<span style="font-size:12px;color:var(--text-3)">'+tagTxt+'</span></div>'
    +'<div class="rec-m">'+esc(meta.join(' · '))+'</div></div>'
    +'<div class="rec-amt '+(isE?'e':(isT?'t':'i'))+' num">'+(isE?'-':(isT?'':'+'))+money(r.amount)+'</div></div>';
}
function bindRecRows(scopeEl){
  var rows=scopeEl.querySelectorAll('.rec');
  for(var i=0;i<rows.length;i++){
    (function(el){ el.addEventListener('click',function(){ openEdit(el.getAttribute('data-id')); }); })(rows[i]);
  }
  if(state.flashId){
    var f=scopeEl.querySelector('.rec.flash');
    if(f&&f.scrollIntoView) f.scrollIntoView({behavior:'smooth',block:'center'});
    state.flashId=null;
  }
}
function renderMainDay(){
  var s=dayStats(state.date), box=$('mainArea');
  if(s.count===0){
    box.innerHTML='<div class="empty">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7h16v13H4z"/><path d="M8 3v4M16 3v4"/></svg>'
      +'<div>这天还没有记录</div><button class="btn sm" id="emptyAdd" style="margin-top:12px">记一笔</button></div>';
    var b=$('emptyAdd');
    if(b) b.addEventListener('click',function(){ openEdit(null); });
    return;
  }
  var html='<div class="day-head"><b>'+fmtDateCN(state.date)+'</b><span>'+weekdayCN(state.date)+' · 共 '+s.count+' 笔</span></div>';
  for(var i=0;i<s.list.length;i++) html+=recRowHTML(s.list[i]);
  box.innerHTML=html;
  bindRecRows(box);
}
function renderMainWeek(){
  var ws=weekStartOf(state.date);
  var w=weekStats(ws);
  var box=$('mainArea');
  if(w.count===0){
    box.innerHTML='<div class="empty">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 19V9M10 19V5M16 19v-8"/><path d="M3 21h18"/></svg>'
      +'<div>这一周还没有记录</div><button class="btn sm" id="emptyAdd" style="margin-top:12px">记一笔</button></div>';
    var b=$('emptyAdd');
    if(b) b.addEventListener('click',function(){ openEdit(null); });
    return;
  }
  var avg=w.expense/7;
  var rows=[];
  for(var i=0;i<7;i++){
    var d=addDays(ws,i);
    var ds=dayStats(d);
    rows.push({ label:'周'+weekdayShort(d), sub:Number(d.slice(5,7))+'/'+Number(d.slice(8,10)),
      value:ds.expense, over:ds.expense>avg&&ds.expense>0, date:d, today:d===todayStr() });
  }
  var html='<div class="chart-wrap">'+barChartSVG(rows,{avg:avg})+'</div>';
  html+='<div class="sub-t" style="padding:0 16px">本周流水（按天分组，点标题可折叠）</div>';
  for(var j=6;j>=0;j--){
    var dd=addDays(ws,j);
    var list=recordsOn(dd);
    if(list.length===0) continue;
    var dexp=sumBy(list,'expense');
    var folded=!!state.folded[dd];
    html+='<div class="fold-head'+(folded?' folded':'')+'" data-fold="'+dd+'">'
      +'<b>'+fmtDateCN(dd)+'</b><span>'+weekdayCN(dd)+' · '+list.length+' 笔 · 支出 '+money0(dexp)+'</span>'
      +'<span class="caret"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>';
    if(!folded){ for(var k=0;k<list.length;k++) html+=recRowHTML(list[k]); }
  }
  box.innerHTML=html;
  bindRecRows(box);
  var bars=box.querySelectorAll('rect[data-date]');
  for(var m=0;m<bars.length;m++){
    (function(el){ el.addEventListener('click',function(){ state.date=el.getAttribute('data-date'); state.view='day'; refreshAll(); }); })(bars[m]);
  }
  var folds=box.querySelectorAll('[data-fold]');
  for(var n=0;n<folds.length;n++){
    (function(el){ el.addEventListener('click',function(){
      var kk=el.getAttribute('data-fold');
      state.folded[kk]=!state.folded[kk];
      refreshAll();
    }); })(folds[n]);
  }
}
function renderMainMonth(){
  var mk=monthKey(state.date);
  var y=Number(mk.slice(0,4)), mo=Number(mk.slice(5,7));
  var dim=daysInMonth(y,mo);
  var first=mk+'-01';
  var lead=(toDate(first).getDay()+6)%7;
  var avg=dayAvgOfMonth(mk);
  var today=todayStr();
  var html='<div class="cal"><div class="cal-head">';
  var names=['一','二','三','四','五','六','日'];
  for(var i=0;i<7;i++) html+='<span>'+names[i]+'</span>';
  html+='</div><div class="cal-grid">';
  for(var b=0;b<lead;b++) html+='<div class="cal-cell l0 out"></div>';
  for(var dd=1;dd<=dim;dd++){
    var dstr=mk+'-'+pad2(dd);
    var ds=dayStats(dstr);
    var lvl=0;
    if(ds.expense>0){
      if(avg<=0) lvl=1;
      else if(ds.expense<avg*0.5) lvl=1;
      else if(ds.expense<avg) lvl=2;
      else if(ds.expense<avg*1.5) lvl=3;
      else lvl=4;
    }

function renderNote(){
  var scope=state.view, key;
  if(scope==='day') key=state.date;
  else if(scope==='week') key=weekKeyOf(state.date);
  else key=monthKey(state.date);
  var title = scope==='day'?'今日小记':(scope==='week'?'本周小记':'本月小记');
  var ph = scope==='day'?'随手记两句，比如：今天克制住了没点奶茶…'
    :(scope==='week'?'这周有什么值得记的？比如：外卖点太多了，下周控制下':'这个月的消费感受、下个月的打算…');
  var n=getNote(scope,key);
  $('noteArea').innerHTML='<h3 class="sec-t">'
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v15H4z"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>'
    +title+'</h3>'
    +'<div class="note-box"><div class="note-auto" id="noteAuto">'+autoSummaryOf(scope,key)+'</div>'
    +'<textarea class="note" id="noteIn" placeholder="'+esc(ph)+'">'+esc(n?(n.content||''):'')+'</textarea></div>';
  var ta=$('noteIn');
  ta.addEventListener('blur',function(){ saveNoteContent(scope,key,ta.value); });
  ta.addEventListener('input',function(){
    clearTimeout(ta._tm);
    ta._tm=setTimeout(function(){ saveNoteContent(scope,key,ta.value); },800);
  });
}

function distRowsHTML(dist, limit, colorOf){
  if(dist.total<=0) return '<div style="font-size:12px;color:var(--text-3)">暂无数据</div>';
  var html='', max=dist.rows[0].value;
  var n=Math.min(limit||5, dist.rows.length);
  for(var i=0;i<n;i++){
    var r=dist.rows[i];
    var w=Math.max(3,Math.round(r.value/max*100));
    var pct=Math.round(r.value/dist.total*100);
    html+='<div class="dist-row"><span class="dist-n">'+esc(r.name!=null?r.name:catById(r.id).name)+'</span>'
      +'<span class="dist-bar"><span class="dist-fill" style="width:'+w+'%;background:'+colorOf(r)+'"></span></span>'
      +'<span class="dist-v num">'+money0(r.value)+' · '+pct+'%</span></div>';
  }
  return html;
}
function tagColor(name){
  return name==='冲动'?'#C25B54':(name==='非必要'?'#C98A2E':(name==='必要'?'#3F8A6B':'#8A94A0'));

/* 把输入框的值同步回 form —— 每次重渲染前必须调用，
   否则用户「先输金额再选分类」时金额会被清空 */
function syncFormFromDOM(){
  if(!form) return;
  var a=$('eAmt'),m=$('eMerchant'),dd=$('eDate'),t=$('eTime'),n=$('eNote'),f=$('eFixed');
  if(a) form.amount=a.value;
  if(m) form.merchant=m.value;
  if(dd) form.date=dd.value||form.date;
  if(t) form.time=t.value||form.time;
  if(n) form.note=n.value;
  if(f) form.isFixed=f.checked;
}

    return '<button class="cat-b'+(on?' on':'')+(c.custom?' custom':'')+'" data-cat="'+c.id+'"'

  +accOptions().map(function(a){ return '<button class="chip'+(a.id===form.account?' on':'')+'" data-acc="'+esc(a.id)+'">'+esc(a.name)+'</button>'; }).join('')
  +'</div></div>'
  +(form.type==='transfer'?'<div class="fld"><span class="lb">转入账户</span><div class="chips" id="eToAccs">'
  +accOptions().map(function(a){ return '<button class="chip'+(a.id===form.toAccount?' on':'')+'" data-toacc="'+esc(a.id)+'">'+esc(a.name)+'</button>'; }).join('')
  +'</div></div>':'')

function bindEditEvents(){
  var sheet=$('sheetEdit');
  function q(sel){ return sheet.querySelectorAll(sel); }
  var cans=q('#eCancel');
  for(var i=0;i<cans.length;i++) cans[i].addEventListener('click',closeEdit);
  var tb=q('.seg button');
  for(var t=0;t<tb.length;t++){
    (function(btn){ btn.addEventListener('click',function(){
      form.type=btn.getAttribute('data-type'); form.category=''; form.subCategory=''; renderEditSheet();
    }); })(tb[t]);
  }
  var cb=q('[data-cat]');
  for(var c=0;c<cb.length;c++){
    (function(btn){ btn.addEventListener('click',function(){
      form.category=btn.getAttribute('data-cat'); form.subCategory=''; renderEditSheet();
    }); })(cb[c]);
  }
  var sb=q('[data-sub]');
  for(var s=0;s<sb.length;s++){
    (function(btn){ btn.addEventListener('click',function(){
      var v=btn.getAttribute('data-sub'); form.subCategory=(form.subCategory===v)?'':v; renderEditSheet();
    }); })(sb[s]);
  }
  var ab=q('[data-acc]');
  for(var a=0;a<ab.length;a++){
    (function(btn){ btn.addEventListener('click',function(){
      var v=btn.getAttribute('data-acc'); form.account=(form.account===v)?'':v; renderEditSheet();
    }); })(ab[a]);
  }
  var tb2=q('[data-toacc]');
  for(var ta=0;ta<tb2.length;ta++){
    (function(btn){ btn.addEventListener('click',function(){
      var v=btn.getAttribute('data-toacc'); form.toAccount=(form.toAccount===v)?'':v; renderEditSheet();
    }); })(tb2[ta]);
  }
  var gb=q('[data-tag]');
  for(var g=0;g<gb.length;g++){
    (function(btn){ btn.addEventListener('click',function(){
      var v=btn.getAttribute('data-tag'), idx=form.tags.indexOf(v);
      if(idx>=0) form.tags.splice(idx,1); else form.tags.push(v);
      renderEditSheet();
    }); })(gb[g]);
  }
  var nb=q('[data-scene]');
  for(var n=0;n<nb.length;n++){
    (function(btn){ btn.addEventListener('click',function(){
      var v=btn.getAttribute('data-scene'); form.scene=(form.scene===v)?'':v; renderEditSheet();
    }); })(nb[n]);
  }
  var del=$('eDel');
  if(del) del.addEventListener('click',function(){
    confirmBox({ title:'删除这条记录？', desc:'删除后无法恢复。', okText:'删除', danger:true,
      onOk:function(){ deleteRecord(form.id); closeEdit(); refreshAll(); toast('已删除'); } });
  });
  var sv=$('eSave'); if(sv) sv.addEventListener('click',function(){ doSave(false); });
  var sm=$('eSaveMore'); if(sm) sm.addEventListener('click',function(){ doSave(true); });
  var addBtn=$('eCatAdd');
  if(addBtn) addBtn.addEventListener('click',function(){ openCatEditor(); });
  var dels=q('[data-catdel]');
  for(var di=0;di<dels.length;di++){
    (function(btn){ btn.addEventListener('click',function(e){
      e.stopPropagation();
      var cid=btn.getAttribute('data-catdel'), c=catById(cid);
      confirmBox({ title:'删除分类「'+c.name+'」？', desc:'已用该分类的记录会保留，仅分类归到「其他」。', okText:'删除', danger:true,
        onOk:function(){
          DB.settings.categories=DB.settings.categories.filter(function(x){ return x.id!==cid; });
          var fallback=(c.type==='income'?'otherIncome':(c.type==='transfer'?'otherTransfer':'other'));
          for(var i=0;i<DB.records.length;i++){ if(DB.records[i].category===cid) DB.records[i].category=fallback; }
          if(form.category===cid) form.category='';
          saveDB(); renderEditSheet(); toast('已删除「'+c.name+'」');
        } });
    }); })(dels[di]);
  }
}
function readForm(){
  syncFormFromDOM();
  if(!form.date) form.date=state.date;
  if(!form.time) form.time=nowTime();
}
function doSave(andContinue){
  readForm();
  var amt=Number(form.amount);
  if(!form.amount||isNaN(amt)||amt<=0){ toast('请输入大于 0 的金额'); $('eAmt').focus(); return; }
  if(!form.category){ toast('请选择一个分类'); return; }
  if(form.type==='transfer'){
    if(!form.account && !form.toAccount){ toast('请选择转出或转入账户'); return; }
    if(form.account && form.toAccount && form.account===form.toAccount){ toast('转出和转入不能是同一个账户'); return; }
  }else if(!form.account){
    toast('请选择一个账户'); return;
  }
  var savedDate=form.date||state.date;
  if(form.id){
    updateRecord(form.id,form);
    closeEdit();
    state.date=savedDate; state.view='day';
    refreshAll(); toast('已保存');
  }else{
    addRecord(form);
    if(andContinue){
      var keep={date:form.date,type:form.type,category:form.category,account:form.account,tags:form.tags.slice(),scene:form.scene};
      form=blankForm(keep.date);
      form.type=keep.type; form.category=keep.category;
      form.account=keep.account; form.tags=keep.tags; form.scene=keep.scene;
      state.date=keep.date;
      renderEditSheet(true); refreshAll(); toast('已保存，继续记');
    }else{
      closeEdit();
      state.date=savedDate; state.view='day';
      refreshAll(); toast('已记录');
    }
  }
}
